name: skill-sources

on:
  schedule:
    # Weekly, Monday 06:00 UTC: catches deleted, archived, or abruptly stale entries.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "data/skill-sources.json"
      - "docs/skill-sources.md"
      - "scripts/check-skill-sources.py"
      - "scripts/test-check-skill-sources.py"

permissions:
  contents: read

jobs:
  verify:
    name: Verify listed repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the data file and its rendering
        run: |
          python3 scripts/test-check-skill-sources.py
          python3 scripts/check-skill-sources.py --offline --check-docs
      - name: Verify repositories against the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-skill-sources.py
