name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs on a PR are wasted work; on main we keep every run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25
        with:
          globs: "**/*.md"

  links:
    name: Relative links, anchors, images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check links, anchors, and image paths
        run: python3 scripts/check-links.py

  skills:
    name: Skill contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Negative-test the checkers
        run: |
          python3 scripts/test-check-links.py
          python3 scripts/test-validate-skills.py
      - name: Validate every skill, including the template
        run: python3 scripts/validate-skills.py

  secrets:
    name: No credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan file contents for credential-shaped strings
        run: python3 scripts/scan_secrets.py
      - name: Reject credential-bearing filenames
        run: |
          set -euo pipefail
          forbidden='(^|/)(nuget\.config|\.npmrc|settings\.xml|\.gemrc|\.env)$'
          forbidden="$forbidden"'|(^|/)\.gem/credentials$|(^|/)\.bundle/config$|\.(pem|key|p12|pfx)$'
          if git ls-files | grep -Ei "$forbidden"; then
            echo "::error::Credential-bearing file(s) are tracked. Remove them from git, rotate the token, then re-run."
            exit 1
          fi
          echo "No credential-bearing filenames tracked."

  links-upstream:
    name: External links (report only)
    # Non-blocking on purpose: third-party documentation sites move, rate-limit
    # CI, or reject bots. This surfaces rot without failing an unrelated change.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check external URLs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --accept 200,206,403,429
            "./**/*.md"
          fail: true
